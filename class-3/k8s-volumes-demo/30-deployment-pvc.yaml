apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvc-nginx
  namespace: vol-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pvc-nginx
  template:
    metadata:
      labels:
        app: pvc-nginx
    spec:
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: pvc-demo
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              mkdir -p /mnt/site;
              echo "Hello from PVC at $(date)" > /mnt/site/index.html;
          volumeMounts:
            - name: site
              mountPath: /mnt/site
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
---
apiVersion: v1
kind: Service
metadata:
  name: pvc-nginx
  namespace: vol-demo
spec:
  type: ClusterIP
  selector:
    app: pvc-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
