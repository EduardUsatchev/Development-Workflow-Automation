apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flask-demo.fullname" . }}
  labels:
    {{- include "flask-demo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flask-demo.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flask-demo.name" . }}
    spec:
      containers:
        - name: flask
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          ports:
            - containerPort: 5000
