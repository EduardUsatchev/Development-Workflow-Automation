apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deploy
  namespace: demo-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-demo
  template:
    metadata:
      labels:
        app: flask-demo
    spec:
      containers:
        - name: flask
          image: flask-demo:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /moshe
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /moshe
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
