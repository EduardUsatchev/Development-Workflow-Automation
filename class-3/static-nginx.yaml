# static-nginx.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hostpath-pv
spec:
  capacity:
    storage: 2Gi
  accessModes: ["ReadWriteOnce"]    # Minikube is single-node → RWO is fine
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/web                 # lives inside the Minikube VM
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hostpath-claim
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
  volumeName: hostpath-pv           # binds specifically to our PV
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-nginx
spec:
  replicas: 1
  selector:
    matchLabels: { app: static-nginx }
  template:
    metadata:
      labels: { app: static-nginx }
    spec:
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - |
              mkdir -p /seed;
              echo "Hello from static hostPath PV at $(date)" > /seed/index.html;
              cp /seed/index.html /usr/share/nginx/html/index.html;
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web
              mountPath: /usr/share/nginx/html
      volumes:
        - name: web
          persistentVolumeClaim:
            claimName: hostpath-claim
---
apiVersion: v1
kind: Service
metadata:
  name: static-nginx
spec:
  selector: { app: static-nginx }
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
