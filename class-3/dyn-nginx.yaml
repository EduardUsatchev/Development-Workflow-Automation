# dyn-nginx.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard           # Minikube default
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dyn-nginx
spec:
  replicas: 1
  selector:
    matchLabels: { app: dyn-nginx }
  template:
    metadata:
      labels: { app: dyn-nginx }
    spec:
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ["sh","-c"]
          args:
            - |
              echo "Hello from dynamically-provisioned PVC at $(date)" > /var/www/index.html;
              ls -l /var/www; cat /var/www/index.html
          volumeMounts:
            - name: data
              mountPath: /var/www
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: web-data
---
apiVersion: v1
kind: Service
metadata:
  name: dyn-nginx
spec:
  selector: { app: dyn-nginx }
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
