name: Build & Push Docker (flask-minikube-demo)

on:
  push:
    branches: [ main ]
    paths:
      - "class-3/flask-minikube-demo/**"
      - ".github/workflows/docker-build-push.yml"
  pull_request:
    paths:
      - "class-3/flask-minikube-demo/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tree (debug)
        run: |
          ls -la
          ls -la class-3 || true
          ls -la class-3/flask-minikube-demo || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short SHA
        id: meta
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: class-3/flask-minikube-demo
          file: class-3/flask-minikube-demo/Dockerfile
          push: true
          tags: |
            a18ab77c4b90/workflow-automation:latest
            a18ab77c4b90/workflow-automation:${{ steps.meta.outputs.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
